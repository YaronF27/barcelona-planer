<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3954">
<title>Barcelona 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{sea:'#0B3954',az:'#1B8A9A',sun:'#F4B63F',salt:'#F3F7F8'}}}}</script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@layer base{html,body{background:#F3F7F8;color:#0B3954;font-family:Inter,system-ui,sans-serif}.font-display{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800}}
@layer components{
.chip{@apply shrink-0 rounded-full border border-sea/20 bg-white px-4 py-2 text-sm font-semibold whitespace-nowrap}
.chip.on{@apply bg-sea text-white border-sea}
.btn-ic{@apply shrink-0 rounded-full p-2 text-sea/80 active:bg-sea/10}
.btn-ic svg{width:1.25rem;height:1.25rem}
.btn{@apply inline-flex items-center justify-center gap-2 rounded-xl bg-sea px-4 py-3 font-semibold text-white active:opacity-80}
.inp{@apply w-full rounded-xl border border-sea/20 bg-white px-3 py-2.5 text-base outline-none focus:ring-2 focus:ring-az}
.lbl{@apply mb-1 mt-3 block text-sm font-semibold}
}
:root{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="fixed left-1/2 top-4 z-50 hidden -translate-x-1/2 rounded-full bg-sea px-4 py-2 text-sm text-white shadow-lg"></div>
<script>
const $=s=>document.querySelector(s),
h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid=()=>Math.random().toString(36).slice(2,9),
eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),
DAYS=[...Array(7)].map((_,i)=>`2026-10-${19+i}`),
dl=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'}),
HOTEL={name:'Hotel del Mar',addr:'Hotel del Mar, Pla de Palau, 19, Barcelona'},
maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),
sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bcn26:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join(''),
sorted=a=>[...a].sort((x,y)=>(x.time||'99').localeCompare(y.time||'99')),
HOLA={2:18.7,3:27.3,4:35.6,5:43.6},
PACK=['Reisepass / Personalausweis','Tickets offline speichern','Auslandskrankenversicherung / Versichertenkarte','Powerbank & Ladekabel','Regenjacke (Oktober)','Bequeme Laufschuhe','Sonnenbrille & Sonnencreme','Badesachen','Bauchtasche gegen Taschendiebe','Wasserflasche','Medikamente / Reiseapotheke','Bargeld in Euro'],
SQL=`create table if not exists trip_state(
  key text primary key,
  value jsonb,
  updated_at timestamptz default now());
alter table trip_state enable row level security;
create policy "gruppe" on trip_state for all using (true) with check (true);
alter publication supabase_realtime add table trip_state;`;

const DEF={url:'https://tkvbbibxvrucaphmgraf.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrdmJiaWJ4dnJ1Y2FwaG1ncmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NjEzNDYsImV4cCI6MjEwNzIzNzM0Nn0.okQ_CvS2V-_KnbSwO_TSjEXteN1vZIhMNVshBm9FVtI',gem:'AQ.Ab8RN6I1ZCf03Ijb_qhazBxlAdgGGSabV1S6CHLIYR2_o3Aktg',model:'gemini-3.8-flash'};
let cfg={...DEF}, sb=null, S={},
ui={auto:new Set(),msgs:[],hist:[],chat:false,cb:false,noLoc:false,tab:'plan',plan:null,day:DAYS[0],modal:null,sync:'local',err:'',busy:false,pend:false,tr:{p:4,days:6,r:4,hd:5}};

const seed=()=>({
 plans:[{id:uid(),name:'Hauptplan der Gruppe',days:{
  '2026-10-19':[{id:uid(),time:'10:00',title:'Abflug ab Prag',place:'Václav Havel Airport Prague',note:'Hinflug gegen 10:00 Uhr',done:false},
   {id:uid(),time:'',title:'Check-in Hotel del Mar',place:HOTEL.addr,note:'Metro Barceloneta (L4) liegt in der Nähe',done:false}],
  '2026-10-25':[{id:uid(),time:'',title:'Rückflug nach Prag (früh morgens)',place:'Barcelona-El Prat Airport',note:'Transfer zum Flughafen am Vorabend planen',done:false}]}}],
 packing:PACK.map(t=>({id:uid(),t,d:false}))});

function loadLocal(){const s=seed();for(const k in s){try{const v=JSON.parse(localStorage['bcn_'+k]);if(v)s[k]=v}catch{}}S=s}
const plan=()=>S.plans.find(p=>p.id===ui.plan)||S.plans[0];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2800)}

/* ---------- Supabase ---------- */
function connect(){if(!cfg.url||!cfg.key)return false;try{sb=supabase.createClient(cfg.url,cfg.key);return true}catch{sb=null;return false}}
const applyCfg=v=>{cfg.gem=v?.gem||DEF.gem;cfg.model=v?.model||DEF.model};
async function pull(){const {data,error}=await sb.from('trip_state').select('key,value');if(error)throw error;
 data.forEach(r=>{if(r.key==='config')applyCfg(r.value);else if(r.key in S){S[r.key]=r.value;localStorage['bcn_'+r.key]=JSON.stringify(r.value)}});return data}
async function push(k){localStorage['bcn_'+k]=JSON.stringify(S[k]);if(!sb)return;
 const {error}=await sb.from('trip_state').upsert({key:k,value:S[k],updated_at:new Date().toISOString()});
 ui.sync=error?'err':'ok';if(error)toast('Speichern fehlgeschlagen: '+error.message);render()}
function listen(){sb.channel('trip').on('postgres_changes',{event:'*',schema:'public',table:'trip_state'},p=>{
 const r=p.new;if(r&&r.key==='config'){applyCfg(r.value);return}if(r&&r.key in S&&JSON.stringify(S[r.key])!==JSON.stringify(r.value)){S[r.key]=r.value;localStorage['bcn_'+r.key]=JSON.stringify(r.value);
 const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a))ui.pend=true;else{render();toast('Von Mitreisenden aktualisiert')}}}).subscribe()}
const save=k=>{push(k);render()};

async function start(){loadLocal();
 if(connect()){try{const rows=await pull();for(const k of Object.keys(S))if(!rows.some(r=>r.key===k))await push(k);listen();ui.sync='ok'}catch(e){ui.sync='err';toast('Supabase: '+e.message)}}
 ui.plan=plan()?.id;render()}

/* ---------- Views ---------- */
function vLogin(){return `<div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center bg-sea px-6 py-10 text-white" style="min-width:100%"><div class="mx-auto w-full max-w-sm">
<i data-lucide="lock" class="mb-4"></i><h1 class="font-display text-5xl">Barcelona</h1><p class="mt-1 text-white/70">19.–25. Oktober 2026 für 4 Personen</p>
<label class="lbl mt-8" for="l-pin">Gruppen-PIN</label><input id="l-pin" type="password" autocomplete="current-password" class="inp text-sea" placeholder="mind. 4 Zeichen">
<p class="mt-1 text-xs text-white/60">Erster Start: Die PIN, die du jetzt eingibst, wird zur Gruppen-PIN.</p>
${ui.err?`<p class="mt-3 rounded-lg bg-white/15 p-2 text-sm">${h(ui.err)}</p>`:''}
<button data-a="login" class="btn mt-5 w-full bg-sun !text-sea">Entsperren</button>
</div></div>`}

const vHead=()=>{const d=Math.ceil((new Date('2026-10-19T10:00')-new Date())/864e5),
 c=d>0?`Noch ${d} ${d==1?'Tag':'Tage'}`:new Date()<new Date('2026-10-26')?'Reise läuft':'Gute Heimreise';
 return `<header class="bg-sea px-4 pb-5 pt-4 text-white"><div class="mx-auto flex max-w-xl items-end justify-between"><div>
<h1 class="font-display text-4xl leading-none">Barcelona</h1><p class="mt-1 text-sm text-white/70">19.–25. Oktober 2026, 4 Personen</p></div>
<div class="text-right"><span class="rounded-full bg-sun px-3 py-1 text-sm font-semibold text-sea">${c}</span>
<p class="mt-2 flex items-center justify-end gap-1 text-xs text-white/70"><i data-lucide="${ui.sync==='ok'?'wifi':ui.sync==='err'?'wifi-off':'smartphone'}" class="h-3 w-3"></i>${{ok:'Live synchron',err:'Sync-Fehler',local:'Nur lokal'}[ui.sync]}</p></div></div></header>`};

const vNav=()=>`<nav class="fixed inset-x-0 bottom-0 z-30 border-t border-sea/10 bg-white" style="padding-bottom:env(safe-area-inset-bottom,0px)"><div class="mx-auto flex max-w-xl">${
[['plan','calendar-days','Plan'],['tr','bus','Transport'],['pack','backpack','Packen'],['set','settings','Mehr']].map(([k,i,l])=>
`<button data-a="tab" data-t="${k}" class="flex flex-1 flex-col items-center gap-0.5 py-2 text-xs ${ui.tab===k?'font-semibold text-az':'text-sea/60'}"><i data-lucide="${i}"></i>${l}</button>`).join('')}</div></nav>`;

function vPlan(){const p=plan(),its=sorted(p.days[ui.day]||[]),dn=its.filter(i=>i.done).length;
return `<div class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-2">${S.plans.map(x=>`<button data-a="plan" data-id="${x.id}" class="chip ${x.id===p.id?'on':''}">${h(x.name)}</button>`).join('')}<button data-a="addPlan" class="chip" aria-label="Neuer Plan"><i data-lucide="plus" class="h-4 w-4"></i></button></div>
<div class="mt-3 flex items-center justify-between"><h2 class="font-display text-2xl">${h(p.name)}</h2><div class="flex"><button data-a="ai" class="btn-ic bg-sun" aria-label="KI-Assistent"><i data-lucide="sparkles"></i></button><button data-a="renPlan" class="btn-ic" aria-label="Umbenennen"><i data-lucide="pencil"></i></button><button data-a="delPlan" class="btn-ic" aria-label="Plan löschen"><i data-lucide="trash-2"></i></button></div></div>
<a href="${maps(HOTEL.addr)}" target="_blank" rel="noopener" class="mt-3 flex items-center gap-3 rounded-2xl bg-az p-3 text-white"><i data-lucide="map-pin"></i><span class="flex-1"><b>${HOTEL.name}</b><br><span class="text-sm text-white/80">Pla de Palau, 19: In Google Maps öffnen</span></span><i data-lucide="external-link" class="h-4 w-4"></i></a>
<div class="-mx-4 mt-4 flex gap-2 overflow-x-auto px-4 pb-2">${DAYS.map(d=>`<button data-a="day" data-d="${d}" class="chip ${d===ui.day?'on':''}">${dl(d)}${(p.days[d]||[]).length?` (${p.days[d].length})`:''}</button>`).join('')}</div>
${its.length?`<p class="mt-2 text-sm text-sea/70">${dn} von ${its.length} erledigt</p>`:''}
<ul class="mt-1">${its.map(i=>`<li class="flex items-start gap-3 border-b border-sea/10 py-3 ${i.done?'opacity-50':''}"><input type="checkbox" data-a="toggle" data-id="${i.id}" ${i.done?'checked':''} class="mt-1 h-5 w-5 shrink-0 accent-[#1B8A9A]" aria-label="Erledigt">
<div class="font-display w-12 shrink-0 text-sea">${h(i.time||'–')}</div><div class="min-w-0 flex-1"><div class="font-semibold ${i.done?'line-through':''}">${h(i.title)}</div>${i.note?`<div class="text-sm text-sea/70">${h(i.note)}</div>`:''}
<a href="${maps(i.place||i.title+' Barcelona')}" target="_blank" rel="noopener" class="mt-1 inline-flex items-center gap-1 text-sm font-semibold text-az"><i data-lucide="map-pin" class="h-4 w-4"></i>In Google Maps öffnen</a><button data-a="info" data-id="${i.id}" class="ml-4 mt-1 inline-flex items-center gap-1 text-sm font-semibold text-sea"><i data-lucide="sparkles" class="h-4 w-4"></i>${ui.auto.has(i.id)?'KI recherchiert …':i.info?'Infos ansehen':'KI-Infos'}</button></div>
<button data-a="item" data-id="${i.id}" class="btn-ic" aria-label="Bearbeiten"><i data-lucide="pencil"></i></button><button data-a="delItem" data-id="${i.id}" class="btn-ic" aria-label="Löschen"><i data-lucide="trash-2"></i></button></li>`).join('')||'<p class="py-6 text-sea/60">Für diesen Tag ist noch nichts geplant. Füge etwas hinzu oder lass den KI-Assistenten planen.</p>'}</ul>
<button data-a="item" class="btn mt-4 w-full"><i data-lucide="plus"></i>Aktivität hinzufügen</button>`}

function calc(){const t=ui.tr,P=t.p,rides=P*t.days*t.r,AP=5.9,hd=Math.min(t.hd,t.days),rest=P*Math.max(0,t.days-hd)*t.r;
 return [['Einzeltickets (2,90 € pro Fahrt) plus Flughafen-Tickets',rides*2.9+P*2*AP],
 ['T-Casual (10 Fahrten, 13 €) plus Flughafen-Tickets',Math.ceil(rides/10)*13+P*2*AP],
 [`Hola Barcelona ${t.hd} Tage pro Person${t.hd<t.days?' plus T-Casual für die übrigen Tage':''}`,P*HOLA[t.hd]+Math.ceil(rest/10)*13+(t.hd>=t.days?0:P*AP)]].map(([n,v])=>({n,v}))}
function vTr(){const t=ui.tr,r=calc(),min=Math.min(...r.map(x=>x.v));
const num=(l,k)=>`<label class="block text-sm font-semibold">${l}<input type="number" min="1" value="${t[k]}" data-a="trin" data-k="${k}" class="inp mt-1"></label>`;
return `<h2 class="font-display text-2xl">Transport-Berater</h2><p class="mt-1 text-sm text-sea/70">Richtpreise 2026 für Zone 1. Bitte vor dem Kauf auf tmb.cat und holabarcelona.com prüfen; online gibt es bei Hola Barcelona meist 10 % Rabatt.</p>
<div class="mt-4 grid grid-cols-2 gap-3">${num('Personen','p')}${num('Tage in der Stadt','days')}${num('Fahrten pro Person und Tag','r')}
<label class="block text-sm font-semibold">Hola-Karte<select data-a="trin" data-k="hd" class="inp mt-1">${[2,3,4,5].map(d=>`<option value="${d}" ${t.hd==d?'selected':''}>${d} Tage, ${eur(HOLA[d])}</option>`).join('')}</select></label></div>
<div class="mt-4 space-y-2">${r.map(x=>`<div class="flex items-center justify-between gap-3 rounded-2xl p-3 ${x.v===min?'bg-sun':'bg-white'}"><span class="text-sm">${x.n}${x.v===min?'<br><b>Günstigste Variante</b>':''}</span><span class="text-right"><b class="font-display text-xl">${eur(x.v)}</b><br><span class="text-xs">${eur(x.v/t.p)} pro Person</span></span></div>`).join('')}</div>
<div class="mt-4 space-y-1 text-sm text-sea/80"><p>Die Hola-Karte gilt ab der ersten Nutzung für 48 bis 120 Stunden am Stück und enthält die Flughafen-Metro. Gerechnet wird mit einer Aktivierung bei der Ankunft, die Rückfahrt zum Flughafen kommt bei längeren Aufenthalten extra dazu.</p><p>Die T-Casual lässt sich laut Anbietern meist von mehreren Personen teilen; kurz vor Ort prüfen.</p></div>
<a href="https://www.google.com/maps/dir/?api=1&origin=Barcelona+El+Prat+Airport&destination=${encodeURIComponent(HOTEL.addr)}&travelmode=transit" target="_blank" rel="noopener" class="btn mt-4 w-full"><i data-lucide="navigation"></i>Route Flughafen zum Hotel in Google Maps</a>`}

function vPack(){const l=S.packing,d=l.filter(x=>x.d).length;
return `<h2 class="font-display text-2xl">Packliste</h2><p class="text-sm text-sea/70">${d} von ${l.length} gepackt</p>
<div class="mt-3 flex gap-2"><input id="p-t" class="inp" placeholder="Neuer Eintrag"><button data-a="addPack" class="btn" aria-label="Hinzufügen"><i data-lucide="plus"></i></button></div>
<ul class="mt-2">${l.map(x=>`<li class="flex items-center gap-3 border-b border-sea/10 py-2.5 ${x.d?'opacity-50':''}"><input type="checkbox" data-a="togPack" data-id="${x.id}" ${x.d?'checked':''} class="h-5 w-5 accent-[#1B8A9A]"><span class="flex-1 ${x.d?'line-through':''}">${h(x.t)}</span><button data-a="delPack" data-id="${x.id}" class="btn-ic" aria-label="Löschen"><i data-lucide="trash-2"></i></button></li>`).join('')}</ul>`}

const vSet=()=>`<h2 class="font-display text-2xl">Einstellungen</h2>
<h3 class="mt-4 font-semibold">Gemini KI (gilt für alle)</h3>
<label class="lbl" for="s-gem">API-Key (Google AI Studio)</label><input id="s-gem" type="password" class="inp" value="${h(cfg.gem||'')}">
<label class="lbl" for="s-model">Modell</label><input id="s-model" class="inp" value="${h(cfg.model||'gemini-3.8-flash')}">
<p class="mt-2 text-xs text-sea/60">Änderungen werden in Supabase gespeichert und gelten sofort für alle Mitreisenden.</p>
<button data-a="saveCfg" class="btn mt-3 w-full">Für alle speichern</button>
<button data-a="testSearch" class="btn mt-2 w-full !bg-white !text-sea border border-sea/20">Live-Websuche testen</button>${ui.testRes?`<pre class="mt-2 whitespace-pre-wrap rounded-xl bg-white p-3 text-xs">${h(ui.testRes)}</pre>`:''}
<h3 class="mt-6 font-semibold">PIN ändern</h3><div class="mt-1 flex gap-2"><input id="s-pin" type="password" class="inp" placeholder="Neue PIN"><button data-a="savePin" class="btn">Ändern</button></div>
<p class="mt-2 text-xs text-sea/60">Die PIN ist ein Komfortschutz. Den eigentlichen Schutz bietet, dass URL und Key nicht im GitHub-Repo stehen.</p>
<h3 class="mt-6 font-semibold">Einmalige Supabase-Einrichtung</h3><p class="text-sm text-sea/70">Im SQL Editor ausführen:</p><pre class="mt-1 overflow-x-auto rounded-xl bg-white p-3 text-xs">${h(SQL)}</pre>
<button data-a="copySql" class="btn mt-2 w-full"><i data-lucide="copy"></i>SQL kopieren</button>
<button data-a="logout" class="btn mt-6 w-full !bg-white !text-sea border border-sea/20"><i data-lucide="log-out"></i>Sperren</button>`;

function vModal(){const m=ui.modal;if(!m)return '';let b='';
 if(m.t==='item'){const i=m.id&&(plan().days[ui.day]||[]).find(x=>x.id===m.id)||{};
 b=`<h3 class="font-display text-xl">${m.id?'Aktivität bearbeiten':'Neue Aktivität'} am ${dl(ui.day)}</h3>
<label class="lbl" for="m-time">Uhrzeit</label><input id="m-time" type="time" class="inp" value="${h(i.time||'')}">
<label class="lbl" for="m-title">Titel</label><input id="m-title" class="inp" value="${h(i.title||'')}">
<label class="lbl" for="m-place">Ort für Google Maps</label><input id="m-place" class="inp" value="${h(i.place||'')}" placeholder="z. B. Sagrada Família, Barcelona">
<label class="lbl" for="m-note">Notiz</label><textarea id="m-note" rows="2" class="inp">${h(i.note||'')}</textarea>
<button data-a="saveItem" class="btn mt-4 w-full">Speichern</button>`}
 else if(m.t==='info')b=vInfo(m.id);
 else b=`<h3 class="font-display text-xl">KI-Assistent für „${h(plan().name)}“</h3>
<label class="lbl" for="ai-w">Was möchtet ihr sehen oder erleben?</label><textarea id="ai-w" rows="4" class="inp" placeholder="z. B. Sagrada Família, Park Güell, Tapas, ein ruhiger Strandtag"></textarea>
<label class="lbl" for="ai-t">Schon gebuchte Tickets mit Uhrzeit</label><textarea id="ai-t" rows="3" class="inp" placeholder="z. B. Sagrada Família am 21.10. um 11:00"></textarea>
<label class="mt-3 flex items-center gap-2 text-sm"><input id="ai-r" type="checkbox" class="h-5 w-5 accent-[#1B8A9A]">Bestehende Einträge ersetzen</label>
<button data-a="runAI" class="btn mt-4 w-full" ${ui.busy?'disabled':''}><i data-lucide="sparkles"></i>${ui.busy?'Routen werden geplant …':'Tagesrouten erstellen'}</button>`;
 return `<div class="fixed inset-0 z-40 flex items-end bg-black/40 sm:items-center"><div class="mx-auto max-h-[90vh] w-full max-w-xl overflow-y-auto rounded-t-3xl bg-salt p-5 sm:rounded-3xl" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))"><button data-a="close" class="btn-ic float-right" aria-label="Schließen"><i data-lucide="x"></i></button>${b}</div></div>`}

function render(){const r=$('#app');
 r.innerHTML=sessionStorage.bcn_in?vHead()+`<main class="mx-auto max-w-xl px-4 pb-28 pt-4">${{plan:vPlan,tr:vTr,pack:vPack,set:vSet}[ui.tab]()}</main>`+vNav()+vFab()+vModal()+(ui.chat?vChat():''):vLogin();
 lucide.createIcons();ui.pend=false;const cl=$('#c-list');if(cl)cl.scrollTop=cl.scrollHeight}

/* ---------- KI ---------- */
async function runAI(){if(!cfg.gem)return toast('Bitte zuerst den Gemini-Key unter „Mehr“ eintragen');
 const wish=$('#ai-w').value,tix=$('#ai-t').value,rep=$('#ai-r').checked;ui.busy=true;render();
 const prompt=`Du bist Reiseplaner für Barcelona. Gruppe: 4 Personen. Unterkunft: ${HOTEL.addr}. Zeitraum 19.10.2026 bis 25.10.2026. Hinflug am 19.10. gegen 10:00 Uhr ab Prag (Ankunft in Barcelona ca. 2 Stunden später, danach Transfer und Check-in). Rückflug am 25.10. früh morgens: an diesem Tag nur die Abreise einplanen.
Wünsche: ${wish||'allgemeine Highlights'}
Bereits gebuchte Tickets (Zeiten sind fix): ${tix||'keine'}
Aufgabe: Erstelle tagesgenaue Routen, geografisch sinnvoll gruppiert, mit kurzen Wegezeiten ab dem Hotel bzw. vom vorherigen Ort, realistischen Öffnungszeiten sowie Pausen und Essen. Nenne im Feld note die Anreise (Verkehrsmittel und Minuten). Antworte NUR mit JSON in diesem Format: {"days":[{"date":"YYYY-MM-DD","items":[{"time":"HH:MM","title":"","place":"Name und Adresse für Google Maps","note":""}]}]}`;
 try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model||'gemini-3.8-flash'}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.gem},
  body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  const out=JSON.parse(j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,'').trim()),p=plan();
  for(const dd of out.days||[]){if(!DAYS.includes(dd.date))continue;
   const it=(dd.items||[]).map(i=>({id:uid(),done:false,time:i.time||'',title:i.title||'',place:i.place||'',note:i.note||''}));
   p.days[dd.date]=rep?it:[...(p.days[dd.date]||[]),...it]}
  ui.modal=null;toast('Plan erstellt')}catch(e){toast('KI-Fehler: '+e.message)}
 ui.busy=false;save('plans')}

const fmt=t=>h(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').map(l=>/^\s*[-*] /.test(l)?`<div class="mt-1 flex gap-2"><span>•</span><span>${l.replace(/^\s*[-*] /,'')}</span></div>`:l.trim()?`<p class="mt-2">${l}</p>`:'').join('');
const CTX=`Familie mit 4 Personen, Unterkunft ${HOTEL.addr}, Reisezeit 19. bis 25.10.2026`,
findIt=(pid,day,id)=>{const p=S.plans.find(x=>x.id===pid);return[p,(p?.days[day]||[]).find(x=>x.id===id)]},
infoPrompt=(it,day)=>`Du bist Reiseberater für Barcelona (${CTX}). Recherchiere aktuell im Web zu diesem Programmpunkt: "${it.title}"${it.place?` (Ort bzw. Einstiegspunkt: ${it.place})`:''}${it.time?`, geplante Uhrzeit ${it.time}`:''} am ${dl(day)}. Notiz: ${it.note||'keine'}.${it.q?` Besonderer Wunsch: ${it.q}`:''}
Antworte auf Deutsch, kompakt und ohne Einleitung: **Empfehlung** (bester Anbieter bzw. beste Option mit kurzer Begründung, bei mehreren Anbietern ein kurzer Vergleich), **Preise** für 4 Personen, **Zeiten** (Abfahrts- bzw. Öffnungszeiten genau für den Einstiegspunkt bzw. Ort im Oktober), **Anfahrt** vom Hotel, **Tipps** (Vorab-Buchung, beste Uhrzeit, Wartezeit). Wenn du etwas nicht sicher findest, schreibe das ausdrücklich und nenne die offizielle Webseite. Nutze **Fettdruck** für Überschriften und Listen mit "- ".`;

async function gem(body,model){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model||cfg.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.gem},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j}
const gemF=b=>gem(b);
async function ask(prompt){const body={contents:[{role:'user',parts:[{text:prompt}]}]},
 parse=j=>{const c=j.candidates?.[0],text=(c?.content?.parts||[]).map(x=>x.text||'').join('').trim();if(!text)throw new Error('Keine Antwort erhalten');
  const seen=new Set(),src=(c.groundingMetadata?.groundingChunks||[]).map(g=>g.web).filter(w=>w&&w.uri&&!seen.has(w.uri)&&seen.add(w.uri)).slice(0,6).map(w=>({t:w.title||'',u:w.uri}));return{text,src}},
 tries=[[cfg.model,1],[cfg.model,0]];let last,gerr='';
 for(const [m,w] of tries){try{return{...parse(await gem(w?{...body,tools:[{google_search:{}}]}:body,m)),web:!!w,err:w?'':gerr}}catch(e){last=e;if(w&&!gerr)gerr=e.message}}throw last}

 else{const r=await ask(infoPrompt(it,day));it.info={text:r.text,src:r.src,web:r.web,err:r.err||'',ts:Date.now()}}}
 catch(e){toast('KI-Fehler: '+e.message)}

 {name:'add_item',description:'Aktivität zu einem Tag hinzufügen',parameters:OBJ({plan_id:S_('Plan-ID, leer = aktiver Plan'),date:S_('Datum YYYY-MM-DD'),time:S_('Uhrzeit HH:MM'),title:S_('Titel'),place:S_('Ort bzw. Adresse für Google Maps'),note:S_('Notiz')},['date','title'])},

QUICK=['Wohin muss ich als Nächstes und wie komme ich hin?','Wie komme ich zum Hotel zurück?','Was können wir heute noch machen?','Plane Tag 3 neu mit mehr Pausen'],

newIt=i=>({id:uid(),done:false,time:i.time||'',title:i.title||'',place:i.place||'',note:i.note||''}),
RUN={
 add_item:(a,c)=>{if(!DAYS.includes(a.date))return{error:'Datum nur 2026-10-19 bis 2026-10-25'};const p=pl(a),i=newIt(a);(p.days[a.date]=p.days[a.date]||[]).push(i);c.log.push(`Hinzugefügt: ${a.title} (${dl(a.date)})`);return{ok:true,id:i.id}},

  if(a.date&&a.date!==d&&DAYS.includes(a.date)){l.splice(l.indexOf(i),1);(p.days[a.date]=p.days[a.date]||[]).push(i)}c.log.push(`Geändert: ${i.title}`);return{ok:true}}}return{error:'ID nicht gefunden'}},
 delete_item:(a,c)=>{for(const p of S.plans)for(const d in p.days){const i=p.days[d].find(x=>x.id===a.id);if(i){p.days[d]=p.days[d].filter(x=>x!==i);c.log.push(`Gelöscht: ${i.title}`);return{ok:true}}}return{error:'ID nicht gefunden'}},

 search_web:async a=>{try{const r=await ask(a.query+' (Barcelona, Oktober 2026; knapp und mit Fakten antworten)');return{text:r.text,live:r.web,hinweis:r.web?'':'KEINE Live-Websuche möglich (Google-Kontingent). Sage dem Nutzer ausdrücklich, dass die Angaben nicht aktuell geprüft sind.'}}catch(e){return{error:e.message}}}};

function sysPrompt(loc){const n=new Date(),today=n.toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'}),tm=n.toLocaleString('de-DE',{timeZone:'Europe/Madrid',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}),
 plans=S.plans.map(p=>({plan_id:p.id,name:p.name,tage:Object.fromEntries(Object.entries(p.days).map(([d,l])=>[d,sorted(l).map(i=>({id:i.id,zeit:i.time,titel:i.title,ort:i.place,notiz:i.note,erledigt:i.done,infos:i.info?.text?.slice(0,400)}))]))}));

Regeln: Antworte auf Deutsch, kurz und konkret. Bei Fragen wie "Wohin als Nächstes?" nimm den ersten nicht erledigten Punkt von heute (nach Uhrzeit) im aktiven Plan, nenne Ort, Uhrzeit und die genaue Anreise ab Standort (Verkehrsmittel, Linie, Haltestelle, Minuten) und rufe zusätzlich show_map mit dem Ziel auf. Nutze search_web für aktuelle Zeiten, Preise und Anbieter. Du darfst die Planung ändern (add_item, update_item, delete_item, replace_day, add_plan), wenn der Nutzer es wünscht oder klar meint, und beschreibst danach kurz, was du geändert hast. Datumsformat YYYY-MM-DD, nur 2026-10-19 bis 2026-10-25. Erfinde keine Zeiten oder Preise.`}

async function chatSend(text){if(!cfg.gem)return toast('Bitte zuerst den Gemini-Key unter „Mehr“ eintragen');
 ui.msgs.push({r:'u',t:text});ui.cb=true;render();
 const loc=await getLoc(),ctx={cards:[],log:[],loc},contents=[...ui.hist,{role:'user',parts:[{text}]}];let out='';
 try{for(let n=0;n<6;n++){
  const j=await gemF({systemInstruction:{parts:[{text:sysPrompt(loc)}]},contents,tools:[{functionDeclarations:FD}]}),c=j.candidates?.[0]?.content;
  if(!c)throw new Error('Keine Antwort erhalten');contents.push(c);
  const fc=(c.parts||[]).filter(x=>x.functionCall);
  if(!fc.length){out=(c.parts||[]).map(x=>x.text||'').join('').trim();break}
  const resp=[];for(const x of fc){const nm=x.functionCall.name;let r;try{r=await RUN[nm](x.functionCall.args||{},ctx)}catch(e){r={error:e.message}}resp.push({functionResponse:{name:nm,response:r}})}
  contents.push({role:'user',parts:resp})}}
 catch(e){out='Fehler: '+e.message}
 out=out||'Erledigt.';ui.hist.push({role:'user',parts:[{text}]},{role:'model',parts:[{text:out}]});ui.hist=ui.hist.slice(-20);
 ui.msgs.push({r:'a',t:out,cards:ctx.cards,log:ctx.log});ui.cb=false;if(ctx.log.length)save('plans');else render()}
